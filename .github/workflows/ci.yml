name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift --version
      - run: swift build
      - run: swift test
  tvos:
    name: tvOS build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodebuild -downloadPlatform tvOS
      - run: cd RiptideTV && xcodegen generate
      - run: xcodebuild -project RiptideTV/RiptideTV.xcodeproj -scheme RiptideTV -destination 'generic/platform=tvOS Simulator' build CODE_SIGNING_ALLOWED=NO
